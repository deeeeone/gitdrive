name: Bug report
description: Something in GitDrive doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Make a folder called ...
        2. Drag a file into it ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GitDrive version
      description: Settings → About
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `log show --last 10m --predicate 'subsystem == "com.diwan.gitdrive"'`. Remove anything private first.
      render: text
