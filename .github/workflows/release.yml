name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        run: |
          xcodegen generate
          xcodebuild -project GitDrive.xcodeproj -scheme GitDrive -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent GitDrive.app "GitDrive-${GITHUB_REF_NAME}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/Build/Products/Release/GitDrive-${GITHUB_REF_NAME}.zip" \
            --title "GitDrive $GITHUB_REF_NAME" --generate-notes --prerelease
